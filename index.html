<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Vault</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #0b1020;
      color: #e5e7eb;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #121a2b;
      border: 1px solid #26314d;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }

    h1, h2 { margin-top: 0; }

    input, button, textarea {
      font: inherit;
    }

    input[type="text"],
    input[type="number"],
    input[type="search"],
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.8;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin: 4px;
    }

    button.secondary { background: #334155; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .album-card {
      background: #121a2b;
      border: 1px solid #26314d;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .album-title {
      margin-bottom: 8px;
      font-weight: bold;
      line-height: 1.8;
    }

    .album-description {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .album-frame {
      position: relative;
      width: 100%;
      height: 220px;
      background: #020617;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .album-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      transition: transform .2s ease;
      cursor: pointer;
    }

    .album-frame img:hover {
      transform: scale(1.08);
    }

    .counter {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,.6);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 3;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty {
      padding: 16px;
      text-align: center;
      color: #94a3b8;
      border: 1px dashed #334155;
      border-radius: 14px;
    }

    label.inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
    }

    .hint {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.8;
      margin-top: -4px;
      margin-bottom: 10px;
    }

    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .viewer[hidden] { display: none; }

    .viewer-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .viewer-content {
      flex: 1;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewer-content img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .viewer-meta {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Photo Vault</h1>

    <div class="card">
      <h2>ذخیره عکس</h2>

      <input id="codeInput" type="text" placeholder="کد را وارد کنید" />

      <textarea id="descriptionInput" placeholder="توضیحات عکس را وارد کنید"></textarea>

      <input id="fileInput" type="file" accept="image/*" multiple />

      <label class="inline">
        <input id="compressToggle" type="checkbox" />
        <span>فشرده‌سازی قبل از ذخیره</span>
      </label>

      <input id="qualityRange" type="number" min="0.1" max="1" step="0.1" value="0.8" placeholder="کیفیت 0.1 تا 1" />
      <input id="maxWidthInput" type="number" value="1600" placeholder="حداکثر عرض" />

      <div class="row">
        <button id="saveBtn" class="success">ذخیره همه با این کد</button>
        <button id="clearPickBtn" class="secondary">پاک کردن انتخاب‌ها</button>
        <button id="backupBtn" class="secondary">Backup JSON</button>

        <label class="secondary" style="padding:10px 14px;border-radius:12px;background:#334155;cursor:pointer;">
          Restore
          <input id="restoreInput" type="file" accept="application/json" hidden />
        </label>

        <button id="clearAllBtn" class="danger">حذف همه</button>
        <button id="refreshBtn" class="secondary">رفرش</button>
      </div>
    </div>

    <div class="card">
      <h2>جستجو / نمایش ذخیره‌شده‌ها</h2>

      <input id="searchInput" type="search" placeholder="جستجو با کد یا توضیحات" />

      <div class="hint">
        جستجو با فارسی و انگلیسی کار می‌کند. مثال: 123 و ۱۲۳ هر دو یکی هستند. اگر کد دقیق وارد شود، فقط همان کد نمایش داده می‌شود.
      </div>

      <div class="row">
        <button id="searchBtn">جستجو</button>
        <button id="refreshBtn2" class="secondary">نمایش همه</button>
      </div>

      <div id="emptyState" class="empty">هنوز چیزی ذخیره نشده است</div>
      <div id="list"></div>
    </div>
  </div>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-top">
      <button id="viewerCloseBtn" class="danger">بستن</button>
      <button id="viewerPrevBtn" class="secondary">قبلی</button>
      <button id="viewerNextBtn" class="secondary">بعدی</button>
      <button id="viewerDownloadBtn">دانلود</button>
      <button id="viewerShareBtn" class="secondary">اشتراک‌گذاری</button>
    </div>

    <div class="viewer-content">
      <img id="viewerImg" alt="viewer" />
    </div>

    <div id="viewerMeta" class="viewer-meta"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
